[project]
name = "portfolio-tooling"
version = "0.1.0"
description = "Python tooling for the portfolio site: notebook rendering and validation utilities"
requires-python = ">=3.12"
dependencies = [
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "jupyter>=1.1",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]
